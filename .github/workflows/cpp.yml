name: C++ toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Compile headers, starters and algorithm suites
        run: python3 scripts/cp_workflow.py check --compiler "$CXX" --mode sanitize
      - name: Check practice commands and revision scheduling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run seeded differential example
        run: python3 scripts/cp_workflow.py stress examples/stress/solution.cpp examples/stress/brute.cpp examples/stress/generator.cpp --iterations 100 --mode sanitize --timeout 5
